<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balanceamento de Parenteses</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-white">
  <main class="bg-gray-100 p-6 flex flex-col items-center gap-4">
    <h1 class="text-xl">Balanceamento de Parenteses</h1>

    <form id="form-valor" class="flex flex-wrap items-center gap-2">
      <input id="input-valor" type="text" required placeholder="Digite a expressão" class="border px-2 py-1">
      <button type="submit" class="border px-3 py-1 bg-white">Confirmar</button>
    </form>

    <p id="mensagem" class="text-sm h-5"></p>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
